name: Bug Report
description: Report a problem or error in the repository
title: "[Bug]: "
labels: ["type:bug", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Thank you for reporting an issue! Please provide detailed information to help us fix it quickly.
        
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe what's wrong...
    validations:
      required: true
      
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true
      
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true
      
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, what happened was...
    validations:
      required: true
      
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the repository is affected?
      options:
        - Documentation
        - Issue Templates
        - Wiki Pages
        - GitHub Actions
        - Project Boards
        - File Structure
        - Links/References
        - Other
    validations:
      required: true
      
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Low - Minor inconvenience
        - Medium - Affects functionality but has workaround
        - High - Significantly impacts use
        - Critical - Blocks all work or exposes sensitive data
      default: 1
    validations:
      required: true
      
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Error Messages
      description: If applicable, add screenshots or paste error messages
      placeholder: Paste screenshots or error messages here...
    validations:
      required: false
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide relevant environment details:
        - Browser (if UI issue)
        - Operating System
        - Git version (if applicable)
        - Any other relevant context
      placeholder: |
        Browser: Chrome 120.0
        OS: macOS 14.1
        Git: 2.42.0
    validations:
      required: false
      
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Additional information...
    validations:
      required: false
      
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have provided clear steps to reproduce
          required: true
        - label: I have not included any sensitive or confidential information
          required: true
