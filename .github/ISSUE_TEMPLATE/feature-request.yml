name: Feature Request
description: Suggest a new feature or enhancement for the repository
title: "[Feature]: "
labels: ["type:enhancement", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Thank you for suggesting an improvement! Please provide as much detail as possible.
        
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: A clear and concise description of the feature...
    validations:
      required: true
      
  - type: textarea
    id: problem
    attributes:
      label: Problem It Solves
      description: What problem does this feature solve? Why is it needed?
      placeholder: This feature would help with...
    validations:
      required: true
      
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How do you envision this feature working?
      placeholder: The feature could work by...
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions or features?
      placeholder: Alternatively, we could...
    validations:
      required: false
      
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which area does this feature relate to?
      options:
        - Documentation
        - Case Management
        - Evidence Tracking
        - Timeline Management
        - Automation/Actions
        - Project Boards
        - Wiki
        - Security
        - Other
    validations:
      required: true
      
  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Significant impact
        - Critical - Blocking current work
      default: 1
    validations:
      required: true
      
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request
      placeholder: Additional information...
    validations:
      required: false
      
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: This feature aligns with the repository's purpose (legal case documentation)
          required: true
        - label: I have considered security and privacy implications
          required: true
