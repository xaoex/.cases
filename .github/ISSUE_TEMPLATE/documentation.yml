name: Documentation Update
description: Suggest improvements or corrections to documentation
title: "[Docs]: "
labels: ["documentation", "type:enhancement", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Update
        Help us improve the documentation! Report errors, suggest improvements, or request new documentation.
        
  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: What kind of documentation needs updating?
      options:
        - README
        - Wiki Page
        - Guide/Tutorial
        - Issue Template
        - Code Comments
        - Planning Document
        - Case Documentation
        - Template
        - Other
    validations:
      required: true
      
  - type: textarea
    id: location
    attributes:
      label: Document Location
      description: Which file or page needs updating?
      placeholder: "e.g., wiki/01-how-to-use.md or docs/cases/README.md"
    validations:
      required: true
      
  - type: dropdown
    id: update-type
    attributes:
      label: Type of Update
      description: What kind of update is needed?
      options:
        - Error/Typo Correction
        - Clarification Needed
        - Missing Information
        - Outdated Information
        - New Documentation Needed
        - Reorganization
        - Examples Needed
        - Formatting Issue
      default: 0
    validations:
      required: true
      
  - type: textarea
    id: current-content
    attributes:
      label: Current Content (if applicable)
      description: Quote the current text that needs updating
      placeholder: |
        Currently says:
        "..."
    validations:
      required: false
      
  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Update
      description: What should it say instead? Or what should be added?
      placeholder: |
        Should say:
        "..."
        
        Or should add:
        "..."
    validations:
      required: true
      
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this change needed? How does it improve the documentation?
      placeholder: This change is needed because...
    validations:
      required: true
      
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this update?
      options:
        - Low - Minor improvement
        - Medium - Notable improvement
        - High - Important for clarity
        - Critical - Incorrect information that could cause problems
      default: 1
    validations:
      required: true
      
  - type: textarea
    id: affected-users
    attributes:
      label: Who is Affected?
      description: Who would benefit from this documentation update?
      placeholder: |
        - New users
        - Legal team
        - Contributors
        - All users
    validations:
      required: false
      
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information, screenshots, or examples
      placeholder: Additional information...
    validations:
      required: false
      
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have identified the specific location that needs updating
          required: true
        - label: I have clearly explained what needs to change and why
          required: true
        - label: I have checked this isn't already documented elsewhere
          required: true
        - label: My suggestion maintains professional and formal tone
          required: true
